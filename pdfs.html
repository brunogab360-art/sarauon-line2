<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF — SARAUON-LINE</title>
<link href="https://fonts.googleapis.com/css2?family=Lekton:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="pdf-page">

<div id="loading">CARREGANDO...</div>

<div class="pdf-viewer">
  <div class="pdf-scroll">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <div class="pdf-controls">
    <button class="pdf-btn" id="prev-page" aria-label="Página anterior">&#8592;</button>
    <span id="page-info"></span>
    <button class="pdf-btn" id="next-page" aria-label="Próxima página">&#8594;</button>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-out" aria-label="Diminuir zoom">−</button>
    <button class="zoom-btn" id="zoom-in"  aria-label="Aumentar zoom">+</button>
  </div>
</div>

<a href="index.html" class="red-dot" aria-label="Início"></a>

<script src="js/flipbook.js"></script>
</body>
</html>
